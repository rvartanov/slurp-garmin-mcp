# Slurp garmin-mcp over streamable HTTP, protected by a URL secret.
#
#   1. Create the secret (at least 16 characters; letters, digits and -._~):
#        mkdir -p secrets && openssl rand -hex 32 > secrets/url_secret.txt
#        chmod 644 secrets/url_secret.txt   # the container user must be able to read it
#   2. Log in to Garmin once (interactive, asks for the MFA code if enabled):
#        docker compose run --rm --entrypoint garmin-mcp-auth garmin-mcp
#   3. Start:
#        docker compose up -d
#
# The MCP endpoint is http://127.0.0.1:8000/<secret>/mcp. Put a reverse proxy
# or tunnel with TLS in front before exposing it; see docs/deployment.md.
services:
  garmin-mcp:
    build: .
    image: slurp-garmin-mcp
    container_name: slurp-garmin-mcp
    restart: unless-stopped

    environment:
      GARMIN_MCP_URL_SECRET_FILE: /run/secrets/url_secret
      # Or, or additionally, a bearer token ("Authorization: Bearer <token>"):
      # GARMIN_MCP_HTTP_TOKEN_FILE: /run/secrets/http_token
      # GARMIN_IS_CN: "true"            # Garmin Connect China (garmin.cn)
      # GARMIN_TZ: Europe/Amsterdam     # your time zone; the container runs in UTC
      # GARMIN_TOOL_PROFILE: ""         # see docs/configuration.md
    secrets:
      - url_secret
      # - http_token

    # Loopback only: the reverse proxy or tunnel on this host connects here.
    ports:
      - "127.0.0.1:8000:8000"

    # Garmin tokens and downloaded activity files.
    volumes:
      - garmin-tokens:/data

    # Needed for the interactive login in step 2.
    stdin_open: true
    tty: true

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  garmin-tokens:

secrets:
  url_secret:
    file: ./secrets/url_secret.txt
  # http_token:
  #   file: ./secrets/http_token.txt
