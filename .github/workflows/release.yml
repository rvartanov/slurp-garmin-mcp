name: Release

# Pushing a tag v<version> publishes the Docker image to GHCR and creates a
# GitHub release with that version's CHANGELOG.md section as its text.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/rvartanov/slurp-garmin-mcp

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Version and release notes
      id: meta
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        if ! grep -q "^version = \"$VERSION\"$" pyproject.toml; then
          echo "Tag $GITHUB_REF_NAME does not match the version in pyproject.toml"
          exit 1
        fi
        # The section between "## [<version>]" and the next "## [" heading,
        # without the link references at the end of the file.
        awk -v head="## [$VERSION]" '
          /^## \[/ { if (found) exit; if (index($0, head) == 1) { found = 1; next } }
          found && !/^\[[^]]+\]: / { print }
        ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
        if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
          echo "CHANGELOG.md has no section for $VERSION"
          exit 1
        fi
        TAGS="$IMAGE:$VERSION"
        # A pre-release (v1.1.0-rc1) does not move "latest".
        case "$VERSION" in
          *-*) PRERELEASE=true ;;
          *) PRERELEASE=false; TAGS="$TAGS,$IMAGE:latest" ;;
        esac
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
        echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PRERELEASE: ${{ steps.meta.outputs.prerelease }}
      run: |
        FLAGS=""
        if [ "$PRERELEASE" = true ]; then FLAGS="--prerelease"; fi
        gh release create "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --verify-tag \
          --title "$GITHUB_REF_NAME" \
          --notes-file "$RUNNER_TEMP/notes.md" \
          $FLAGS
