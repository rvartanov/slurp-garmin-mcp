name: Upstream watch

# Weekly check for new commits in Taxuspt/garmin_mcp; keeps one issue
# (label upstream-sync) up to date. See scripts/check_upstream.sh.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch upstream
      run: |
        git remote add upstream https://github.com/Taxuspt/garmin_mcp.git
        git fetch --no-tags upstream main

    - name: Report unmerged upstream commits
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/check_upstream.sh
