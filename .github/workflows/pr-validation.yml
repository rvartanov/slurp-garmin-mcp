name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync

    - name: Run all tests with coverage
      run: |
        uv run pytest tests/integration tests/unit -v \
          --tb=short \
          --strict-markers \
          --maxfail=5
      timeout-minutes: 10

    - name: Check for test files
      run: |
        echo "Integration tests count:"
        find tests/integration -name "test_*.py" | wc -l
        echo "Unit tests count:"
        find tests/unit -name "test_*.py" 2>/dev/null | wc -l || echo "0"

    - name: Validate pyproject.toml
      run: uv run python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

  test-installation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Test package installation
      run: |
        uv python install 3.13
        uv sync
        uv run garmin-mcp --help
        uv run garmin-mcp --version

  pr-info:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: PR Info
      # Untrusted text (title, branch name) goes through env, never into the
      # script itself.
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        printf 'PR #%s\nTitle: %s\nBranch: %s\nBase: %s\n' "$PR_NUMBER" "$PR_TITLE" "$HEAD_REF" "$BASE_REF"
