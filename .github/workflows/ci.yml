name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Make uv sync/run use the matrix interpreter, not the newest one.
      UV_PYTHON: ${{ matrix.python-version }}

    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Run integration tests
      run: uv run pytest tests/integration tests/unit -v --tb=short
      timeout-minutes: 5

    - name: Generated tool lists are up to date
      if: matrix.python-version == '3.13'
      run: |
        uv run python scripts/generate_tools_doc.py --check
        uv run python scripts/generate_dxt_tools.py
        git diff --exit-code dxt/manifest.json

    - name: Test summary
      if: always()
      run: |
        echo "Tests completed for Python ${{ matrix.python-version }}"
        if [ $? -eq 0 ]; then
          echo "✅ All tests passed"
        else
          echo "❌ Some tests failed"
        fi

  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build image
      run: docker build -t slurp-garmin-mcp .

    - name: Refuses to start without authentication
      run: |
        if docker run --rm slurp-garmin-mcp; then
          echo "Server started without a token or URL secret"
          exit 1
        fi

    - name: Serves under the URL secret and becomes healthy
      run: |
        SECRET=$(openssl rand -hex 16)
        docker run -d --name mcp -p 127.0.0.1:8000:8000 -e GARMIN_MCP_URL_SECRET=$SECRET slurp-garmin-mcp
        for i in $(seq 1 30); do
          curl -fs http://127.0.0.1:8000/healthz && break
          sleep 1
        done
        test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = 404
        test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/$SECRET/mcp)" != 404
        for i in $(seq 1 60); do
          [ "$(docker inspect -f '{{.State.Health.Status}}' mcp)" = healthy ] && exit 0
          sleep 1
        done
        docker logs mcp
        exit 1
