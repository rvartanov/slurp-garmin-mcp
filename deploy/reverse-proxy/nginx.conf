# nginx in front of Slurp garmin-mcp.
# The server listens on 127.0.0.1:8000 with GARMIN_MCP_URL_SECRET and/or
# GARMIN_MCP_HTTP_TOKEN set; nginx only adds TLS and passes requests through.
# nginx forwards the public Host header: set GARMIN_MCP_ALLOWED_HOSTS=garmin.example.com.
server {
    listen 443 ssl;
    http2 on;
    server_name garmin.example.com;

    ssl_certificate     /etc/letsencrypt/live/garmin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garmin.example.com/privkey.pem;

    # The request line contains the URL secret: keep it out of the access log.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streamable HTTP and SSE responses are streams: do not buffer them,
        # and allow long-running tool calls.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name garmin.example.com;
    return 301 https://$host$request_uri;
}
